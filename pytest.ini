[pytest]
testpaths = services/accounts/tests services/orders/tests
addopts =
    -q
    -m "not integration and not accounts_down"
    --cov=accounts
    --cov=orders
    --cov-report=term
    --cov-fail-under=80
markers =
    integration: нужны оба поднятых сервиса (docker compose up)
    accounts_down: сервис клиентов погашен (docker compose stop accounts)

python_files = test_*.py
python_functions = test_*
